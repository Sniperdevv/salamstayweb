<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SalamStay — Buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-canvas:#FFFFFF; --bg-raised:#F7F8F8; --bg-sunken:#F4F5F6;
    --text-primary:#16191B; --text-secondary:#5F676D; --text-tertiary:#828A90;
    --text-on-brand:#FFFFFF; --text-on-semantic:#FFFFFF; --text-disabled:#AEB4B9;
    --int-primary:#2E7D6A; --int-primary-hover:#256757; --int-primary-active:#1E5A4C;
    --int-subtle:#EEF6F3; --int-subtle-hover:#D6EAE3; --focus-ring:#2E7D6A;
    --border-hairline:#E7E9EA; --border-default:#D3D7DA; --border-strong:#828A90;
    --error-fg:#A8412F; --error-border:#EBBDB2;
    --shadow-card:0 2px 4px -1px rgba(16,25,27,.06),0 4px 10px -2px rgba(16,25,27,.05);
    --el-subtle:0 1px 2px 0 rgba(16,25,27,.05),0 1px 3px 0 rgba(16,25,27,.04);
    --radius-md:8px; --radius-full:9999px;
  }
  .dark {
    --bg-canvas:#0E1211; --bg-raised:#161B1A; --bg-sunken:#0A0E0D;
    --text-primary:#EDEFEF; --text-secondary:#A7AFAD; --text-tertiary:#8A938F;
    --text-on-brand:#0E1211; --text-on-semantic:#0E1211; --text-disabled:#5B6663;
    --int-primary:#579D8B; --int-primary-hover:#82BCAB; --int-primary-active:#AFD6C9;
    --int-subtle:#16231F; --int-subtle-hover:#1B2C27; --focus-ring:#579D8B;
    --border-hairline:#2A3230; --border-default:#39413F; --border-strong:#5B6663;
    --error-fg:#E39385; --error-border:#4E322C;
    --shadow-card:0 2px 4px -1px rgba(0,0,0,.36),0 4px 10px -2px rgba(0,0,0,.32);
    --el-subtle:0 1px 2px 0 rgba(0,0,0,.3),0 1px 3px 0 rgba(0,0,0,.24);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',-apple-system,sans-serif; background:#EEF0F1; color:var(--text-primary); -webkit-font-smoothing:antialiased; padding:32px; line-height:1.5; }
  .head { max-width:1180px; margin:0 auto 28px; }
  .head h1 { font-size:24px; font-weight:600; letter-spacing:-0.01em; color:#16191B; }
  .head p { font-size:14px; color:#5F676D; margin-top:6px; }
  .grid2 { max-width:1180px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .panel { background:var(--bg-canvas); border-radius:20px; padding:28px; box-shadow:var(--shadow-card); border:1px solid var(--border-hairline); }
  .panel-tag { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:20px; }
  .sec-label { font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-tertiary); margin:22px 0 12px; }
  .sec-label:first-of-type { margin-top:0; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

  .btn { display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 16px; border-radius:var(--radius-md); font-size:13px; font-weight:500; border:1px solid transparent; cursor:pointer; transition:background .12s ease,border-color .12s ease; font-family:inherit; }
  .btn svg { width:20px; height:20px; }
  .btn.sm { height:32px; padding:0 12px; }
  .btn.lg { height:48px; padding:0 20px; }
  .btn.lg svg { width:24px; height:24px; }
  .btn.icon { width:40px; padding:0; justify-content:center; }

  .primary { background:var(--int-primary); color:var(--text-on-brand); }
  .primary.hover { background:var(--int-primary-hover); }
  .primary.active { background:var(--int-primary-active); transform:scale(.98); }
  .primary.focus { box-shadow:0 0 0 2px var(--bg-canvas),0 0 0 4px var(--focus-ring); }
  .primary.disabled { background:var(--border-default); color:var(--text-disabled); cursor:not-allowed; }

  .secondary { background:var(--bg-canvas); color:var(--text-primary); border-color:var(--border-default); }
  .secondary.hover { background:var(--bg-raised); border-color:var(--border-strong); }
  .secondary.active { background:var(--bg-sunken); }
  .secondary.disabled { border-color:var(--border-hairline); color:var(--text-disabled); cursor:not-allowed; }

  .ghost { background:transparent; color:var(--int-primary); }
  .ghost.hover { background:var(--int-subtle); }
  .ghost.active { background:var(--int-subtle-hover); }
  .ghost.disabled { color:var(--text-disabled); cursor:not-allowed; }

  .brand-subtle { background:var(--int-subtle); color:var(--int-primary); }
  .destructive { background:var(--error-fg); color:var(--text-on-semantic); }
  .destructive-outline { background:transparent; color:var(--error-fg); border-color:var(--error-border); }

  .spinner { width:18px; height:18px; border-radius:50%; border:2px solid currentColor; border-top-color:transparent; animation:spin .7s linear infinite; opacity:.9; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .statecap { font-size:11px; color:var(--text-tertiary); width:100%; margin:4px 0 -4px; }
  @media (max-width:880px){ .grid2{ grid-template-columns:1fr; } }
</style>
</head>
<body>
  <div class="head">
    <h1>Buttons</h1>
    <p>One calm brand fill plus quiet secondary/ghost. Radius <code style="font-family:inherit">md</code>, label style, sizes sm/md/lg, full state matrix.</p>
  </div>
  <div class="grid2">
    <div class="panel">
      <div class="panel-tag">Light</div>

      <div class="sec-label">Variants (md)</div>
      <div class="row">
        <button class="btn primary">Reserve</button>
        <button class="btn secondary">Save</button>
        <button class="btn ghost">See halal options</button>
        <button class="btn brand-subtle">Explore</button>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn destructive">Cancel booking</button>
        <button class="btn destructive-outline">Remove</button>
        <button class="btn primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          Continue
        </button>
      </div>

      <div class="sec-label">Sizes</div>
      <div class="row">
        <button class="btn primary sm">Small</button>
        <button class="btn primary">Medium</button>
        <button class="btn primary lg">Large</button>
        <button class="btn secondary icon" aria-label="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8h16v-8M12 3v13M8 7l4-4 4 4"/></svg></button>
      </div>

      <div class="sec-label">Primary states</div>
      <div class="row">
        <span class="statecap">default · hover · focus · active · disabled · loading</span>
        <button class="btn primary">Reserve</button>
        <button class="btn primary hover">Reserve</button>
        <button class="btn primary focus">Reserve</button>
        <button class="btn primary active">Reserve</button>
        <button class="btn primary disabled" disabled>Reserve</button>
        <button class="btn primary" aria-busy="true" style="width:112px;justify-content:center"><span class="spinner"></span></button>
      </div>
    </div>

    <div class="panel dark">
      <div class="panel-tag">Dark</div>

      <div class="sec-label">Variants (md)</div>
      <div class="row">
        <button class="btn primary">Reserve</button>
        <button class="btn secondary">Save</button>
        <button class="btn ghost">See halal options</button>
        <button class="btn brand-subtle">Explore</button>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn destructive">Cancel booking</button>
        <button class="btn destructive-outline">Remove</button>
        <button class="btn primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          Continue
        </button>
      </div>

      <div class="sec-label">Secondary states</div>
      <div class="row">
        <span class="statecap">default · hover · active · disabled</span>
        <button class="btn secondary">Save</button>
        <button class="btn secondary hover">Save</button>
        <button class="btn secondary active">Save</button>
        <button class="btn secondary disabled" disabled>Save</button>
      </div>

      <div class="sec-label">Ghost + loading</div>
      <div class="row">
        <button class="btn ghost">Details</button>
        <button class="btn ghost hover">Details</button>
        <button class="btn ghost disabled" disabled>Details</button>
        <button class="btn primary" aria-busy="true" style="width:112px;justify-content:center"><span class="spinner"></span></button>
      </div>
    </div>
  </div>
</body>
</html>
