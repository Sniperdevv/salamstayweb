<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="SalamStay">
  <!--
    The wordmark, at 32px: ink ground, green dot. The full mark is
    "Salam.Stay" with the stop set in brand-600; at favicon scale the letters
    are unreadable and the stop is the only part that survives, so the mark
    reduces to exactly that — the ink the wordmark is set in, and the one green
    thing on it.

    Two colours, both token values, no gradient (TASTE-RULES §2: flat green,
    never gradient) and no glyph invented for the occasion. `rx="7"` is the
    squircle-ish corner a 32px tile wants; it is the mark's own frame rather
    than a radius off the UI ladder, which stops at 20 + full.

    Ink #16191B is `neutral.ink` (text.primary); green #2E7D6A is brand-600,
    the same value `bg-interactive` resolves to in light mode. Stated as
    literals because an SVG served straight off the filesystem cannot read the
    token package; they are copied from it, not picked.
  -->
  <rect width="32" height="32" rx="7" fill="#16191B"/>
  <circle cx="16" cy="16" r="5" fill="#2E7D6A"/>
</svg>
